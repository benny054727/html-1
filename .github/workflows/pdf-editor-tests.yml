name: PDF editor tests

on:
  pull_request:
    paths: ['pdf-editor/**', '.github/workflows/pdf-editor-tests.yml']
  push:
    branches: [main]
    paths: ['pdf-editor/**']

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android (Chromium)
            browser: chromium
          - name: iPhone (WebKit, Safari's engine)
            browser: webkit
    defaults:
      run:
        working-directory: pdf-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium ${{ matrix.browser == 'webkit' && 'webkit' || '' }}
      - run: node tools/build.mjs --check
      - run: node tests/run.mjs
        env:
          BROWSER: ${{ matrix.browser }}
